<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='%2315803d' viewBox='0 0 256 256'><path d='M48 64a8 8 0 0 1 8-8h16V40a8 8 0 0 1 16 0v16h16a8 8 0 0 1 0 16H88v16a8 8 0 0 1-16 0V72H56a8 8 0 0 1-8-8m136 128h-8v-8a8 8 0 0 0-16 0v8h-8a8 8 0 0 0 0 16h8v8a8 8 0 0 0 16 0v-8h8a8 8 0 0 0 0-16m56-48h-16v-16a8 8 0 0 0-16 0v16h-16a8 8 0 0 0 0 16h16v16a8 8 0 0 0 16 0v-16h16a8 8 0 0 0 0-16m-20.69-64L80 219.31a16 16 0 0 1-22.62 0l-20.7-20.68a16 16 0 0 1 0-22.63L176 36.69a16 16 0 0 1 22.63 0l20.68 20.68a16 16 0 0 1 0 22.63m-54.63 32L144 91.31l-96 96L68.68 208ZM208 68.69 187.31 48l-32 32L176 100.69Z'/></svg>"
    />
    <title>Dashboard — Admin</title>
    <script>
      // Set the theme before the first paint.
      //
      // app.css defines the light palette on bare :root and dark under
      // [data-theme="dark"], and lib/theme.js is a module that runs after the
      // document has painted. Between those two moments a dark-mode visitor saw
      // a light page — a flash on every navigation between these pages.
      //
      // Deliberately a plain, parser-blocking script in the head, not a module:
      // it has to run before CSS is applied, and it is small enough to inline on
      // every page rather than cost a request that would itself delay the paint.
      // Storage can throw (private mode, blocked cookies), so it fails to light.
      try {
        var savedTheme = localStorage.getItem("icon-genie.theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {
        /* no stored preference reachable; the light default stands */
      }
    </script>
    <!-- The shared palette and chrome. This page carries only what is specific
         to the review queue; --warn below is the one token app.css lacks. -->
    <link rel="stylesheet" href="./app.css" />
    <link rel="modulepreload" href="./lib/header.js" />
    <link rel="modulepreload" href="./lib/api.js" />
    <link rel="modulepreload" href="./lib/theme.js" />
    <style>
      /* The palette comes from app.css, which every page links. This page used to
         restate all of it, identically, which meant a change there silently
         stopped at this page. Only --warn is left: it is the one token app.css
         does not define, and only this page uses it. It is darker in light mode
         than in dark, because the dark-mode amber sits near 3:1 on a light
         background — too weak for the text that carries it. */
      :root { --warn: #9a6700; }
      :root[data-theme="dark"] { --warn: #e3b341; }
      /* This page's own title bar, now inside <main> under the shared site
         header. Left as a bare `header` rule it would style that too, giving it a
         second border and a second set of padding. The negative margin pulls it
         out to main's edges so it still reads as a full-width bar. */
      .page-bar {
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        margin: -20px -20px 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .page-bar h1 { margin: 0; font-size: 18px; color: var(--accent); }
      .btn[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
      .btn.ok:hover { border-color: var(--ok); color: var(--ok); }
      .btn.bad:hover { border-color: var(--bad); color: var(--bad); }
      main { padding: 20px clamp(14px, 4vw, 20px); width: min(1100px, 100%); margin: 0 auto; }
      /* The section row. Heavier than the filter row under it and separated by
         a rule, so the two levels do not read as one long row of chips. */
      .dash-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .dash-tabs .btn { font-weight: 600; }
      .dash-tabs .btn[aria-selected="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .filters { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
      .note { color: var(--muted); }
      .card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        padding: 14px;
        margin-bottom: 12px;
      }
      .previews { display: flex; gap: 8px; }
      .previews figure { margin: 0; text-align: center; }
      .previews .cell {
        width: 56px; height: 56px;
        border: 1px solid var(--border); border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg);
      }
      .previews svg { width: 36px; height: 36px; color: var(--fg); }
      .previews figcaption { font-size: 10px; color: var(--muted); margin-top: 3px; }
      .meta { min-width: 0; }
      .meta h2 { margin: 0 0 4px; font-size: 16px; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0 12px; font-size: 14px; }
      dt { color: var(--muted); }
      dd { margin: 0; word-break: break-word; }
      code {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
      pre {
        margin: 0 0 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        overflow-x: auto;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 130px;
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      /* Destructive and identity-changing actions confirm in place rather than
         in a native dialog: the icon stays visible while deciding. */
      .confirm {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 8px; padding: 8px 10px; border-radius: 8px;
        border: 1px solid var(--warn); color: var(--warn); font-size: 12px;
      }
      .confirm[hidden] { display: none; }
      .confirm input {
        background: var(--bg); border: 1px solid var(--border); color: var(--fg);
        padding: 6px 9px; border-radius: 6px; font-size: 14px; width: 180px;
      }
      .btn.danger { border-color: var(--bad); color: var(--bad); }
      .tag { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
      .tag.approved { border-color: var(--ok); color: var(--ok); }
      .tag.rejected { border-color: var(--bad); color: var(--bad); }
      /* Approving this would overwrite the drawing already served under the
         name, so it is called out above the details rather than inside them. */
      .in-gallery {
        margin: 6px 0 0;
        color: var(--bad);
        font-weight: 600;
      }
      .tag.pending { border-color: var(--warn); color: var(--warn); }
      #status { color: var(--muted); margin-bottom: 12px; min-height: 20px; }
      #status.error { color: var(--bad); }
      .panel-block {
        margin-top: 28px; padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .panel-block h2 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
      .panel-block .note { margin: 0 0 12px; font-size: 12px; }
      table.countries { border-collapse: collapse; width: 100%; max-width: 560px; font-size: 14px; }
      table.countries th, table.countries td {
        text-align: left; padding: 6px 10px;
        border-bottom: 1px solid var(--border);
      }
      table.countries th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      /* Counts read as columns of figures, so they align on the right. */
      table.countries td.num, table.countries th.num { text-align: right; font-variant-numeric: tabular-nums; }
      table.countries tr:last-child td { border-bottom: 0; }
      .flag { margin-right: 8px; }

      /* The footer is app.css's now. This page used to restate it as a sticky
         one-line bar, and that flex rule on .footer-inner collapsed the shared
         footer's column grid to a single 320px column. */
      footer { margin-top: 28px; }

      .gate { max-width: 420px; margin: 60px auto; text-align: center; }
      .gate input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 10px 12px;
        border-radius: 8px;
        margin: 12px 0 8px;
        font-size: 14px;
      }

      /* --- Narrow screens ---------------------------------------------- */
      @media (max-width: 640px) {
        /* The preview column and the submission's details stop fitting side by
           side: the previews are five fixed cells, so the details column takes
           whatever is left, which is not enough to read a prompt in. */
        .card { grid-template-columns: 1fr; gap: 12px; }
        /* Labels above values rather than beside them, for the same reason. */
        dl { grid-template-columns: 1fr; gap: 0 0; }
        dl dt { margin-top: 6px; }
        /* The bar bleeds to the page edges by cancelling main's side padding,
           so it has to cancel the value main actually has, not a guess at it. */
        .page-bar {
          margin: -20px calc(-1 * clamp(14px, 4vw, 20px)) 16px;
          padding: 12px clamp(14px, 4vw, 20px);
        }
      }
    </style>
  </head>
  <body>
    <header data-site-header>

      <div class="site-bar">
        <a class="brand" href="./index.html">Genie Icons<span class="brand-mark" aria-hidden="true">🧞</span></a>
        <nav>
          <div class="site-tools">

            <a class="btn" href="./theme.html">Icon Theme</a>
          </div>
          <button class="btn" type="button" data-theme-toggle aria-label="Toggle theme"><span class="tgl-icon">🌙</span><span class="tgl-word">Dark</span></button>
          <div class="who">
            <button class="who-badge" id="who-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="who-menu">

    <main>
      <!-- What is left of this page's own header once the shared one carries the
           brand, the tool links, the theme toggle, and the identity menu with Log
           out in it. Only the title and the one control nothing else has. -->
      <div class="page-bar">
        <h1>Dashboard</h1>
        <span class="grow"></span>
        <button class="btn" id="refresh" type="button">Refresh</button>
      </div>
      <!-- Shown when there is no admin session. The real gate is server-side:
           every /api/submissions call re-checks the cookie, so hiding this panel
           is presentation, never protection. -->
      <section class="gate" id="gate" hidden>
        <h2>Admin login</h2>
        <p class="note">Icon review, visitor counts and usage. All of it needs an admin session.</p>
        <form id="gate-form">
          <input id="gate-password" type="password" placeholder="Admin password" autocomplete="current-password" />
          <button class="btn" type="submit">Log in</button>
        </form>
        <p class="note" id="gate-status"></p>
      </section>

      <section id="queue" hidden>
        <!-- Two levels. The top row picks what the page is about; the row under
             it belongs to whichever section is showing and is absent for the two
             that have nothing to narrow. Keeping them separate is what stops a
             status filter and a whole different view sharing one row, which is
             how "Visitors by country" ended up looking like a fifth status. -->
        <nav class="dash-tabs" id="dash-tabs" aria-label="Dashboard sections">
          <button class="btn" type="button" data-tab="review" aria-selected="true">Icon review</button>
          <button class="btn" type="button" data-tab="visitors" aria-selected="false">Visitors</button>
          <button class="btn" type="button" data-tab="uses" aria-selected="false">Icon usage</button>
          <button class="btn" type="button" data-tab="generate" aria-selected="false">Generator usage</button>
        </nav>

        <div class="filters" id="filters" data-subtabs="review">
          <button class="btn" type="button" data-status="pending" aria-selected="true">Pending</button>
          <button class="btn" type="button" data-status="approved" aria-selected="false">Approved</button>
          <button class="btn" type="button" data-status="rejected" aria-selected="false">Rejected</button>
          <button class="btn" type="button" data-status="" aria-selected="false">All</button>
        </div>

        <div class="filters" id="visitor-subtabs" data-subtabs="visitors" hidden>
          <button class="btn" type="button" data-visitors="totals" aria-selected="true">Total visitors</button>
          <button class="btn" type="button" data-visitors="countries" aria-selected="false">By country</button>
        </div>

        <div id="status"></div>
        <div id="list"></div>

        <!-- Two counters and nothing else. Uniqueness comes from the guest
             cookie the history already needs, so no IP is read or stored. -->
        <section id="visitors-block" hidden>
          <h2 class="section-heading">Total visitors</h2>
          <p class="note" id="visitors-note"></p>
          <table class="countries" id="visitors"></table>
        </section>

        <!-- Aggregates only: a country tally, never a country against a guest
             id. See supabase/migrations/0004_visit_countries.sql. -->
        <section id="countries-block" hidden>
          <h2 class="section-heading">Visitors by country</h2>
          <p class="note" id="countries-note"></p>
          <table class="countries" id="countries"></table>
        </section>

        <!-- Also aggregates only: a count per icon name, never an export against
             a guest id. See supabase/migrations/0005_icon_uses.sql. -->
        <section id="uses-block" hidden>
          <h2 class="section-heading">Icon usage</h2>
          <p class="note" id="uses-note"></p>
          <table class="countries" id="uses"></table>
        </section>

        <!-- Counted in the database and returned as numbers, so no guest id
             reaches this page. See supabase/migrations/0006_generate_usage.sql. -->
        <section id="generate-block" hidden>
          <h2 class="section-heading">Generator usage</h2>
          <p class="note" id="generate-note"></p>

    <footer>
      <div class="footer-inner" data-site-footer-bar></div>
    </footer>

    <script type="module">
      // Same derivation the library and the build use, so what an admin approves
      // is what the React component will render.
      import { deriveWeightInner as weights } from "./stroke-weights.js";
      import { initFooter } from "./lib/footer.js";
      import { withBusy } from "./lib/busy.js";
      // Same header as the other five pages. It owns identity, the theme
      // toggle and Log out, so none of those are this page's job any more.
      import { initHeader } from "./lib/header.js";

      const gate = document.getElementById("gate");
      const gateForm = document.getElementById("gate-form");
      const gatePassword = document.getElementById("gate-password");
      const gateStatus = document.getElementById("gate-status");
      const queue = document.getElementById("queue");
      const list = document.getElementById("list");
      const statusEl = document.getElementById("status");
      const filters = document.getElementById("filters");

      // Escape before interpolating anything a submitter controls. The name and
      // prompt arrive from an open endpoint, so they are untrusted text; path data
      // goes through the server's validator, which rejects anything but path
      // characters.
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );

      async function api(path, opts = {}) {
        const res = await fetch(path, {
          credentials: "same-origin",
          headers: opts.body ? { "content-type": "application/json" } : undefined,
          ...opts,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      }

      function cardHtml(row) {
        const w = weights(row.paths);
        const previews = ["thin", "regular", "fill", "duotone"]
          .map(
            (name) =>
              `<figure><div class="cell"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${w[name]}</svg></div><figcaption>${name}</figcaption></figure>`
          )
          .join("");
        const file = `raw-svgs/${esc(row.name)}/${esc(row.name)}.centerline.svg`;
        const pending = row.status === "pending";
        return `
          <article class="card" data-id="${esc(row.id)}">
            <div class="previews">${previews}</div>
            <div class="meta">
              <h2>${esc(row.name)} <span class="tag ${row.status}">${row.status}</span></h2>
              ${row.inGallery ? `<p class="in-gallery">icon already present in gallery</p>` : ""}
              <dl>
                <dt>Component</dt><dd><code>${esc(toPascal(row.name))}</code></dd>
                <dt>Contributor</dt><dd>${esc(row.contributor || "Anonymous")}</dd>
                <dt>Asked for</dt><dd>${esc(row.prompt) || "<span class='note'>(none)</span>"}</dd>
                <dt>Summary</dt><dd>${esc(row.summary) || "<span class='note'>(none)</span>"}</dd>
                <dt>Paths</dt><dd>${row.paths.length}</dd>
                <dt>Source</dt><dd>${esc(row.source)}</dd>
                <dt>Submitted</dt><dd>${new Date(row.createdAt).toLocaleString()}</dd>
                <dt>Submitter</dt><dd><code>${esc(row.guestId).slice(0, 12)}…</code></dd>
                ${row.reviewedAt ? `<dt>Reviewed</dt><dd>${new Date(row.reviewedAt).toLocaleString()}</dd>` : ""}
                <dt>Add as</dt><dd><code>${file}</code></dd>
              </dl>
              <pre>${esc(centerlineSvg(row.paths))}</pre>
              <div class="actions">
                <button class="btn" data-act="copy">Copy source SVG</button>
                <button class="btn" data-act="download">Download source</button>
                ${pending ? `<button class="btn ok" data-act="approve">Approve</button>` : ""}
                ${pending ? `<button class="btn bad" data-act="reject">Reject</button>` : ""}
                ${!pending ? `<button class="btn" data-act="reopen">Move back to pending</button>` : ""}
                <button class="btn" data-act="rename">Change contributor</button>
                <button class="btn danger" data-act="delete">Delete</button>
              </div>
              <div class="confirm" data-confirm="rename" hidden>
                <span>New contributor name:</span>
                <input data-field="contributor" maxlength="20" value="${esc(row.contributor || "")}" />
                <button class="btn" data-act="rename-save">Save name</button>
                <button class="btn" data-act="cancel">Cancel</button>
              </div>
              <div class="confirm" data-confirm="delete" hidden>
                <span>Delete <strong>${esc(row.name)}</strong>? It leaves the gallery, its source file is
                removed, and the contributor is not told.</span>
                <button class="btn danger" data-act="delete-confirm">Delete for good</button>
                <button class="btn" data-act="cancel">Cancel</button>
              </div>
            </div>
          </article>`;
      }

      function toPascal(name) {
        const p = String(name)
          .split(/[^a-zA-Z0-9]+/)
          .filter(Boolean)
          .map((s) => s[0].toUpperCase() + s.slice(1))
          .join("");
        return /^[0-9]/.test(p) ? "Icon" + p : p || "Icon";
      }

      function centerlineSvg(paths) {
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">${paths
          .map((d) => `<path d="${d}"/>`)
          .join("")}</svg>`;
      }

      let rows = [];

      /** One page of the review queue. `status` is "" for all of them. */
      async function load(status = chosen.review) {
        statusEl.className = "";
        statusEl.textContent = "Loading…";
        try {
          const query = status ? `?status=${encodeURIComponent(status)}` : "";
          const data = await api(`/api/submissions${query}`);
          rows = data.submissions;
          const c = data.counts;
          statusEl.textContent = rows.length
            ? `${rows.length} shown · ${c.pending} pending, ${c.approved} approved, ${c.rejected} rejected`
            : `Nothing ${status || "here"} yet. ${c.pending} pending overall.`;
          list.innerHTML = rows.map(cardHtml).join("");
        } catch (err) {
          if (/admin session/i.test(err.message)) return showGate();
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      function showGate() {
        gate.hidden = false;
        queue.hidden = true;
        gatePassword.focus();
      }

      async function showQueue() {
        gate.hidden = true;
        queue.hidden = false;
        // Through showSection so the panels, the sub-tab row and the selected
        // tab all start consistent with each other, rather than the markup's
        // defaults happening to agree with it.
        await showSection(section);
      }

      async function review(id, status) {
        statusEl.className = "";
        statusEl.textContent = status === "approved" ? "Approving and publishing…" : "Saving…";
        try {
          const { published } = await api(`/api/submissions/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          await load();
          // load() rewrites the status line, so report the publish result after
          // it — an approval that failed to publish must not look like a success.
          if (published) reportPublish(published);
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      function reportPublish(published) {
        statusEl.className = published.error ? "error" : "";
        statusEl.replaceChildren(
          document.createTextNode(`${published.filePath} — ${published.detail} `)
        );
        if (published.url) {
          const a = document.createElement("a");
          a.href = published.url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = published.url;
          statusEl.appendChild(a);
        }
      }

      // The anchor is put in the document and the URL is revoked on a timer:
      // Firefox ignores a click on a detached anchor, and revoking in the same
      // tick cancels the download it has not started reading yet.
      function download(name, text) {
        const url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      /** Show one confirm row on a card and hide the other. */
      function showConfirm(card, which) {
        for (const box of card.querySelectorAll("[data-confirm]")) {
          box.hidden = box.dataset.confirm !== which;
        }
        if (which) card.querySelector(`[data-confirm="${which}"] input`)?.focus();
      }

      async function renameContributor(id, card) {
        const value = card.querySelector('[data-field="contributor"]').value;
        statusEl.className = "";
        statusEl.textContent = "Saving name…";
        try {
          const { submission } = await api(`/api/submissions/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify({ contributor: value }),
          });
          await load();
          statusEl.textContent = `Contributor for ${submission.name} is now ${submission.contributor}.`;
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      async function deleteSubmission(id) {
        statusEl.className = "";
        statusEl.textContent = "Deleting…";
        try {
          const { deleted, unpublished } = await api(`/api/submissions/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          await load();
          statusEl.className = unpublished?.error ? "error" : "";
          statusEl.textContent = `Deleted ${deleted.name}. ${unpublished?.detail ?? ""}`;
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = err.message;
        }
      }

      list.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const card = btn.closest(".card");
        const id = card?.dataset.id;
        const row = rows.find((r) => r.id === id);
        if (!row) return;
        const act = btn.dataset.act;
        // Both special powers ask first: one is destructive, the other rewrites
        // a credit that is shown publicly.
        if (act === "rename") return showConfirm(card, "rename");
        if (act === "delete") return showConfirm(card, "delete");
        if (act === "cancel") return showConfirm(card, null);
        // The five that go to the server show the ring on the button pressed.
        // withBusy also swallows a second click while the first is in flight,
        // which used to double-approve when the queue was slow.
        if (act === "rename-save") return withBusy(btn, () => renameContributor(id, card), { label: "Saving…" });
        if (act === "delete-confirm") return withBusy(btn, () => deleteSubmission(id), { label: "Deleting…" });
        if (act === "approve") return withBusy(btn, () => review(id, "approved"), { label: "Approving…" });
        if (act === "reject") return withBusy(btn, () => review(id, "rejected"), { label: "Rejecting…" });
        if (act === "reopen") return withBusy(btn, () => review(id, "pending"), { label: "Moving…" });
        const svg = centerlineSvg(row.paths) + "\n";
        if (act === "copy") {
          await navigator.clipboard.writeText(svg);
          statusEl.className = "";
          statusEl.textContent = `Copied ${row.name}.centerline.svg — save it to raw-svgs/${row.name}/ and run npm run build:icons`;
        } else if (act === "download") {
          download(`${row.name}.centerline.svg`, svg);
        }
      });

      const dashTabs = document.getElementById("dash-tabs");
      const visitorSubtabs = document.getElementById("visitor-subtabs");

      /**
       * The dashboard's sections. One is on screen at a time: they answer
       * different questions, and a tally hanging under the review queue read as
       * part of it.
       *
       * `blocks` is every panel a section owns, so switching sections hides the
       * lot without each one being named twice. `subtabs` is the row that
       * belongs to the section, absent for the two with nothing to narrow.
       * `load` takes the sub-tab key, which is "" for a section without one.
       */
      const SECTIONS = {
        review: {
          blocks: [],
          subtabs: filters,
          // The queue is the list itself rather than a panel below it.
          list: true,
          load: (status) => load(status),
        },
        visitors: {
          blocks: [document.getElementById("visitors-block"), document.getElementById("countries-block")],
          subtabs: visitorSubtabs,
          load: (which) => (which === "countries" ? loadCountries() : loadVisitorTotals()),
        },
        uses: {
          blocks: [document.getElementById("uses-block")],
          subtabs: null,
          load: () => loadUses(),
        },
        generate: {
          blocks: [document.getElementById("generate-block")],
          subtabs: null,
          load: () => loadGenerateUsage(),
        },
      };

      const ALL_BLOCKS = Object.values(SECTIONS).flatMap((s) => s.blocks);

      /** Which section is showing, and the sub-tab chosen within each. */
      let section = "review";
      const chosen = { review: "pending", visitors: "totals" };

      /** Mark one button as selected and clear its siblings. */
      function markSelected(row, btn) {
        if (!row) return;
        for (const b of row.querySelectorAll("button")) {
          b.setAttribute("aria-selected", String(b === btn));
        }
      }

      /**
       * Show one section and load it.
       *
       * Every panel is hidden first, so a section cannot leave another's table
       * on screen — which is what happened when each view hid only itself and a
       * third view was added.
       */
      function showSection(key, btn) {
        section = key;
        const conf = SECTIONS[key];
        markSelected(dashTabs, btn ?? dashTabs.querySelector(`[data-tab="${key}"]`));

        // Hide every panel and unhide none: each loader reveals its own, on both
        // the success and the failure path. Unhiding a section's panels here
        // showed both of the Visitors ones at once, since the section owns two
        // and only the chosen sub-tab should appear.
        for (const block of ALL_BLOCKS) block.hidden = true;

        for (const other of Object.values(SECTIONS)) {
          if (other.subtabs) other.subtabs.hidden = other.subtabs !== conf.subtabs;
        }

        list.hidden = !conf.list;
        if (!conf.list) statusEl.textContent = "";
        return conf.load(chosen[key] ?? "");
      }

      dashTabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        withBusy(btn, () => showSection(btn.dataset.tab, btn));
      });

      filters.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-status]");
        if (!btn) return;
        markSelected(filters, btn);
        chosen.review = btn.dataset.status;
        withBusy(btn, () => load(btn.dataset.status));
      });

      visitorSubtabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-visitors]");
        if (!btn) return;
        markSelected(visitorSubtabs, btn);
        chosen.visitors = btn.dataset.visitors;
        const conf = SECTIONS.visitors;
        for (const block of conf.blocks) block.hidden = true;
        withBusy(btn, () => conf.load(btn.dataset.visitors));
        // The loader unhides the one that belongs to the sub-tab just chosen.
      });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateStatus.textContent = "Checking…";
        try {
          await withBusy(
            gateForm.querySelector('button[type="submit"], button:not([type])'),
            async () => {
            await api("/api/auth/login", {
              method: "POST",
              body: JSON.stringify({ password: gatePassword.value }),
            });
            gatePassword.value = "";
            gateStatus.textContent = "";
            await showQueue();
            },
            { label: "Checking…" }
          );
        } catch (err) {
          gateStatus.textContent = err.message;
        }
      });

      // Refresh reloads whichever view is showing.
      // Reloads whichever section is showing, at its chosen sub-tab.
      const refreshBtn = document.getElementById("refresh");
      refreshBtn.addEventListener("click", () =>
        withBusy(refreshBtn, () => SECTIONS[section].load(chosen[section] ?? ""), { label: "Refreshing…" })
      );

      /* --- Total visitors --------------------------------------------------- */
      // Two counters, read from the same /api/auth/me the header already calls.
      // Uniqueness comes from the guest cookie the history needs anyway, so no
      // IP is read or stored — which is what keeps this out of DPDP scope.
      async function loadVisitorTotals() {
        const block = document.getElementById("visitors-block");
        const table = document.getElementById("visitors");
        const note = document.getElementById("visitors-note");
        block.hidden = false;
        try {
          const me = await api("/api/auth/me");
          const v = me.visits ?? {};
          if (typeof v.visitors !== "number") {
            note.textContent = "No counters yet. They start once the gallery is visited.";
            table.innerHTML = "";
            return;
          }
          const views = Number(v.views ?? 0);
          note.textContent =
            "Unique visitors are counted by the guest cookie, so one person on two devices counts twice. " +
            "No IP address is read or stored.";
          table.innerHTML =
            "<tr><th>Measure</th><th class='num'>Count</th></tr>" +
            `<tr><td>Unique visitors</td><td class="num">${v.visitors.toLocaleString()}</td></tr>` +
            `<tr><td>Page views</td><td class="num">${views.toLocaleString()}</td></tr>` +
            `<tr><td>Views per visitor</td><td class="num">${
              v.visitors ? (views / v.visitors).toFixed(1) : "—"
            }</td></tr>`;
        } catch (err) {
          note.textContent = `Could not load the visitor counters: ${err.message}`;
          table.innerHTML = "";
        }
      }

      /* --- Generator usage -------------------------------------------------- */
      // How much the generator is used, without Google Analytics or any third
      // party. Counted in the database and returned as numbers: the underlying
      // table keys on the guest cookie, so no guest id reaches this page. See
      // supabase/migrations/0006_generate_usage.sql.
      async function loadGenerateUsage() {
        const block = document.getElementById("generate-block");
        const table = document.getElementById("generate");
        const note = document.getElementById("generate-note");
        block.hidden = false;
        try {
          const u = await api("/api/generate-usage");
          note.textContent =
            `${u.users.toLocaleString()} ${u.users === 1 ? "person has" : "people have"} generated ` +
            `${u.generations.toLocaleString()} ${u.generations === 1 ? "icon" : "icons"} across ` +
            `${u.names.toLocaleString()} ${u.names === 1 ? "name" : "names"}; ` +
            `${u.last7Days.toLocaleString()} in the last 7 days, and ` +
            `${u.contributed.toLocaleString()} were submitted to the library. ` +
            "History keeps the newest 50 entries per person and is pruned on the retention window, " +
            "so these count what is retained rather than all time.";
          if (!u.top.length) {
            table.innerHTML = "";
            return;
          }
          table.innerHTML =
            "<tr><th>Prompted name</th><th class='num'>Generations</th>" +
            "<th class='num'>People</th><th>Last generated</th></tr>" +
            u.top
              .map(
                (r) =>
                  `<tr><td>${esc(r.name)}</td>` +
                  `<td class="num">${r.generations.toLocaleString()}</td>` +
                  `<td class="num">${r.users.toLocaleString()}</td>` +
                  `<td>${r.lastGenerated ? new Date(r.lastGenerated).toLocaleDateString() : "—"}</td></tr>`
              )
              .join("");
        } catch (err) {
          note.textContent = `Could not load the generate tally: ${err.message}`;
          table.innerHTML = "";
        }
      }

      /* --- Visitors by country --------------------------------------------- */
      // ISO alpha-2 codes come back from the API; the names come from the
      // browser rather than a bundled country table, and the flag from the
      // regional-indicator code points for the same two letters.
      const countryName = (() => {
        let names = null;
        try {
          names = new Intl.DisplayNames(navigator.languages ?? ["en"], { type: "region" });
        } catch {
          /* older browser: fall back to the raw code */
        }
        return (code) => {
          // ZZ is the ISO code for "no country reported". Every row currently under
        // it is local test traffic, so it is labelled as such — but the code also
        // covers a real visit that arrives with no CDN header, which this name
        // would then describe wrongly. Clear the row and rename this back if the
        // app is ever served without a CDN in front of it.
        if (code === "ZZ") return "ClaudeTest";
          try {
            return names?.of(code) || code;
          } catch {
            return code;
          }
        };
      })();

      function flagFor(code) {
        if (!/^[A-Z]{2}$/.test(code) || code === "ZZ") return "🏳️";
        return String.fromCodePoint(...[...code].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
      }

      async function loadCountries() {
        const block = document.getElementById("countries-block");
        const table = document.getElementById("countries");
        const note = document.getElementById("countries-note");
        try {
          const { countries } = await api("/api/visits/countries");
          block.hidden = false;
          if (!countries.length) {
            note.textContent = "No visits recorded yet.";
            table.innerHTML = "";
            return;
          }
          const totalVisitors = countries.reduce((n, c) => n + c.visitors, 0);
          const totalViews = countries.reduce((n, c) => n + c.views, 0);
          note.textContent =
            `${totalVisitors.toLocaleString()} visitors and ${totalViews.toLocaleString()} views across ` +
            `${countries.length} ${countries.length === 1 ? "country" : "countries"}. ` +
            `Counts only — no country is stored against a visitor.`;
          const unknown = countries.find((c) => c.country === "ZZ");
          if (unknown) {
            // Without this the row reads as a bug rather than as what it is: a
            // visit that arrived with no CDN country header, which is every
            // visit in local development.
            note.textContent +=
              ` "ClaudeTest" (${unknown.views.toLocaleString()} views) is traffic that reached the app` +
              ` without a country header — local development, or a deploy with no CDN in front of it.`;
          }
          table.innerHTML =
            "<tr><th>Country</th><th class='num'>Visitors</th><th class='num'>Views</th><th>Last seen</th></tr>" +
            countries
              .map(
                (c) =>
                  `<tr><td><span class="flag">${flagFor(c.country)}</span>${esc(countryName(c.country))}` +
                  `<span class="note"> ${esc(c.country)}</span></td>` +
                  `<td class="num">${c.visitors.toLocaleString()}</td>` +
                  `<td class="num">${c.views.toLocaleString()}</td>` +
                  `<td>${c.lastSeen ? new Date(c.lastSeen).toLocaleDateString() : "—"}</td></tr>`
              )
              .join("");
        } catch (err) {
          // The queue is the page's job; a missing tally must not hide it.
          block.hidden = false;
          note.textContent = `Could not load the country tally: ${err.message}`;
          table.innerHTML = "";
        }
      }

      /* --- Icon usage ------------------------------------------------------ */
      // Every copy and every download of an icon, counted per name. One person
      // taking an icon as SVG and then as PNG counts twice: these are exports,
      // not people, and not installs — the npm package is used without ever
      // reaching this site.
      async function loadUses() {
        const block = document.getElementById("uses-block");
        const table = document.getElementById("uses");
        const note = document.getElementById("uses-note");
        try {
          const { icons, totals } = await api("/api/uses");
          block.hidden = false;
          // "of which", not "more": record_icon_use adds a resizer export to
            // icon_downloads before it adds the resizer's own total, so the
            // figure is already inside the downloads count above.
          const resizer = totals.resizerExports
            ? ` Of the downloads, ${totals.resizerExports.toLocaleString()} came from the resizer, ` +
              `which works on files users supply rather than on our icons; no filename is stored.`
            : "";
          note.textContent =
            `${icons.length.toLocaleString()} ${icons.length === 1 ? "icon" : "icons"} used, ` +
            `${totals.copies.toLocaleString()} copies and ${totals.downloads.toLocaleString()} downloads ` +
            `in total. Counts only — no export is stored against a visitor.` +
            resizer;
          if (!icons.length) {
            table.innerHTML = "";
            return;
          }
          table.innerHTML =
            "<tr><th>Icon</th><th class='num'>Copies</th><th class='num'>Downloads</th>" +
            "<th class='num'>Total</th><th>Last used</th></tr>" +
            icons
              .map(
                (i) =>
                  `<tr><td>${esc(i.name)}</td>` +
                  `<td class="num">${i.copies.toLocaleString()}</td>` +
                  `<td class="num">${i.downloads.toLocaleString()}</td>` +
                  `<td class="num">${(i.copies + i.downloads).toLocaleString()}</td>` +
                  `<td>${i.lastUsed ? new Date(i.lastUsed).toLocaleDateString() : "—"}</td></tr>`
              )
              .join("");
        } catch (err) {
          block.hidden = false;
          note.textContent = `Could not load the usage tally: ${err.message}`;
          table.innerHTML = "";
        }
      }

      try {
        // initHeader resolves the identity it already had to fetch to label
        // itself, so this page reads it from there rather than asking again.
        // visit:false keeps working through the queue out of the visit count.
        const who = await initHeader({ current: "", visit: false });
        // After the header, so both read one memoised /api/auth/me in a fixed order.
        initFooter();
        if (who.offline) throw new Error("no API");
        if (who.role === "admin") await showQueue();
        else showGate();
      } catch {
        statusEl.className = "error";
        statusEl.textContent =
          "No API reachable. This page needs the backend running (vercel dev), not a static file server.";
        gate.hidden = true;
        queue.hidden = false;
      }
    </script>
  </body>
</html>
